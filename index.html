<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stahl App</title>
    <!-- PWA & Mobile Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#D90429"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://esm.sh/react-image-crop@11.0.5/dist/ReactCrop.css">
    <style>
      :root {
        --dark-bg: #050505;
        --primary-purple: #D90429; /* Changed to red */
        --primary-purple-hover: #EF233C; /* Changed to brighter red */
        --accent-white: #F0F0F0;
        --accent-gray: #8A8A8A;
        --card-bg: #0D0D0D;
        --border-color: rgba(217, 4, 41, 0.2); /* Changed to red */
        --font-heading: 'Oswald', sans-serif; /* "Iron Punk" style: Bold, Uppercase */
        --font-body: 'Roboto', sans-serif; /* "Blackbox" style: Clean, modern */
      }

      body {
        background-color: var(--dark-bg);
        color: var(--accent-white);
        font-family: var(--font-body);
        overflow-x: hidden;
      }
      
      .font-heading {
        font-family: var(--font-heading);
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .font-body {
        font-family: var(--font-body);
      }
      
      .ui-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .ui-card:hover {
        border-color: var(--primary-purple);
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(217, 4, 41, 0.1); /* Changed to red */
      }
      
      .btn-primary {
        font-family: var(--font-heading);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid transparent;
        background: var(--primary-purple);
        color: var(--accent-white);
        transition: all 0.3s ease;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: var(--primary-purple-hover);
        box-shadow: 0 0 20px rgba(217, 4, 41, 0.5); /* Changed to red */
        transform: scale(1.05);
      }
       .btn-primary:disabled {
        background: var(--accent-gray);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      
      .btn-secondary {
        font-family: var(--font-heading);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: 1px solid var(--primary-purple);
        background: transparent;
        color: var(--primary-purple);
        transition: all 0.3s ease;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-secondary:hover {
        background: var(--primary-purple);
        color: var(--accent-white);
      }
      
      .form-input {
          background-color: rgba(0,0,0,0.5);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          color: var(--accent-white);
          padding: 0.75rem 1rem;
          width: 100%;
          font-size: 1rem;
          transition: border-color 0.3s, box-shadow 0.3s;
      }
      
      .form-input:focus {
          outline: none;
          border-color: var(--primary-purple);
          box-shadow: 0 0 10px rgba(217, 4, 41, 0.5);
      }
      
      input[type="number"].form-input {
          text-align: center;
          font-size: 1.25rem;
      }

      input[type="date"].form-input::-webkit-calendar-picker-indicator {
        filter: invert(27%) sepia(99%) saturate(4191%) hue-rotate(345deg) brightness(88%) contrast(104%);
      }

      .password-container {
        position: relative;
        width: 100%;
      }

      .password-toggle-icon {
        position: absolute;
        top: 50%;
        right: 1rem;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--accent-gray);
      }
      .password-toggle-icon:hover {
        color: var(--accent-white);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
          animation: fadeIn 0.8s ease-out forwards;
      }
      
      .text-gradient-purple {
        background: linear-gradient(45deg, var(--primary-purple), #FF7B72); /* Changed to red gradient */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Loading Screen Styles */
      .glitch-container {
        position: relative;
      }
      .glitch-text {
        position: relative;
        color: var(--accent-white);
        z-index: 1;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--dark-bg);
        overflow: hidden;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -1px 0 var(--primary-purple);
        animation: glitch-anim-1 2.5s infinite linear reverse;
        z-index: 0;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -1px 0 var(--accent-gray);
        animation: glitch-anim-2 2.5s infinite linear reverse;
        z-index: 0;
      }

      @keyframes glitch-anim-1 {
        0% { clip-path: inset(10% 0 85% 0); } 5% { clip-path: inset(45% 0 40% 0); } 10% { clip-path: inset(90% 0 2% 0); } 15% { clip-path: inset(25% 0 70% 0); } 20% { clip-path: inset(65% 0 20% 0); } 25% { clip-path: inset(5% 0 90% 0); } 30% { clip-path: inset(80% 0 5% 0); } 35% { clip-path: inset(35% 0 55% 0); } 40% { clip-path: inset(50% 0 30% 0); } 45% { clip-path: inset(20% 0 75% 0); } 50% { clip-path: inset(95% 0 1% 0); } 55% { clip-path: inset(15% 0 80% 0); } 60% { clip-path: inset(60% 0 25% 0); } 65% { clip-path: inset(40% 0 45% 0); } 70% { clip-path: inset(88% 0 8% 0); } 75% { clip-path: inset(22% 0 68% 0); } 80% { clip-path: inset(75% 0 15% 0); } 85% { clip-path: inset(30% 0 60% 0); } 90% { clip-path: inset(55% 0 28% 0); } 95% { clip-path: inset(12% 0 82% 0); } 100% { clip-path: inset(78% 0 18% 0); }
      }

      @keyframes glitch-anim-2 {
        0% { clip-path: inset(92% 0 5% 0); } 5% { clip-path: inset(33% 0 58% 0); } 10% { clip-path: inset(8% 0 85% 0); } 15% { clip-path: inset(66% 0 22% 0); } 20% { clip-path: inset(48% 0 42% 0); } 25% { clip-path: inset(98% 0 1% 0); } 30% { clip-path: inset(44% 0 48% 0); } 35% { clip-path: inset(2% 0 95% 0); } 40% { clip-path: inset(77% 0 11% 0); } 45% { clip-path: inset(55% 0 35% 0); } 50% { clip-path: inset(18% 0 78% 0); } 55% { clip-path: inset(82% 0 9% 0); } 60% { clip-path: inset(28% 0 65% 0); } 65% { clip-path: inset(70% 0 19% 0); } 70% { clip-path: inset(40% 0 50% 0); } 75% { clip-path: inset(85% 0 4% 0); } 80% { clip-path: inset(20% 0 70% 0); } 85% { clip-path: inset(60% 0 30% 0); } 90% { clip-path: inset(38% 0 55% 0); } 95% { clip-path: inset(90% 0 3% 0); } 100% { clip-path: inset(10% 0 80% 0); }
      }
      
      .loading-bar {
        width: 250px;
        height: 6px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        border: 1px solid var(--border-color);
      }
      .loading-bar-inner {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--primary-purple-hover), transparent);
        animation: loading-bar-anim 1.8s infinite;
      }
      
      @keyframes loading-bar-anim {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }

      @keyframes mascot-sway {
        0%, 100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-8px) rotate(1deg);
        }
      }

      .animate-mascot-sway {
        animation: mascot-sway 4s ease-in-out infinite;
        transform-origin: bottom center;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.23.0?deps=react@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.378.0?deps=react@18.2.0",
    "qrcode.react": "https://esm.sh/qrcode.react@3.1.0?deps=react@18.2.0",
    "@yudiel/react-qr-scanner": "https://esm.sh/@yudiel/react-qr-scanner@1.2.0?deps=react@18.2.0",
    "react-image-crop": "https://esm.sh/react-image-crop@11.0.5?deps=react@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
